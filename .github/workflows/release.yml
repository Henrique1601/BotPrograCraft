name: Release Desktop & IDE Extension

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build, Typecheck & Test
        run: |
          $ErrorActionPreference = 'Stop'
          npm run build:shared
          npm run build --workspace=@botprogracraft/storage --workspace=@botprogracraft/ai-core
          npm run build
          npm run typecheck
          npm test --workspaces --if-present

      - name: Package IDE Extension (.vsix)
        run: npm run package:vsix --workspace=botprogracraft-ide-extension

      - name: Package Desktop App (Windows)
        run: |
          $ErrorActionPreference = 'Stop'
          npx --yes electron-builder@26.18.0 --win --x64 --dir --projectDir packages/desktop-app
          $zipName = if ("${{ github.ref_type }}" -eq "tag") { "BotPrograCraft-${{ github.ref_name }}-win-x64.zip" } else { "BotPrograCraft-dev-win-x64.zip" }
          Compress-Archive -Path "release/win-unpacked/*" -DestinationPath "release/$zipName" -Force

      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/BotPrograCraft-*-win-x64.zip
            packages/ide-extension/*.vsix
          generate_release_notes: true
