name: Release Desktop & IDE Extension

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build, Typecheck & Test
        run: |
          npm run build
          npm run typecheck
          npm test --workspaces --if-present

      - name: Package IDE Extension (.vsix)
        run: npm run package:vsix --workspace=botprogracraft-ide-extension

      - name: Package Desktop App (Windows)
        run: |
          npx --workspace=@botprogracraft/desktop-app electron-builder --win --x64 --dir
          Compress-Archive -Path "release/win-unpacked/*" -DestinationPath "release/BotPrograCraft-${{ github.ref_name }}-win-x64.zip" -Force

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/BotPrograCraft-${{ github.ref_name }}-win-x64.zip
            packages/ide-extension/*.vsix
          generate_release_notes: true
